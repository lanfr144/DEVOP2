# ==============================================================================
# DEVOP2 - Unit 05 - Git lab in Docker
# ==============================================================================
# The only service is the toolbox (git + GitHub CLI): nothing on the host.
#   ./start.sh                         # creates .env from .env.example if missing
#   docker compose exec tools bash     # a shell with git and gh ready
#   docker compose down
# GH_TOKEN, GIT_USER_NAME and GIT_USER_EMAIL come from .env (git-ignored).
# No port is published. Health: HEALTHCHECK of ../docker/Dockerfile.
# ==============================================================================
services:
  tools:
    build:
      context: ../docker
    image: devop2-tools:1.0
    healthcheck:
      # same test as the HEALTHCHECK of ../docker/Dockerfile, repeated here so
      # that "docker compose config" shows a healthcheck for every service
      test:
        - "CMD-SHELL"
        - "python -c 'import yaml, dotenv, pymongo' && git --version >/dev/null && gh --version >/dev/null && curl --version >/dev/null || exit 1"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    init: true
    restart: unless-stopped
    working_dir: /work/Unit05
    volumes:
      - ..:/work
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
